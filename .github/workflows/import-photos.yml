name: Importar fotos originais
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/import_photos.py
      - name: Publicar produtos com fotos verificadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js photo-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Importa fotografias originais verificadas por código"
            git push
          fi
